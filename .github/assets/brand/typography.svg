<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <rect width="1000" height="700" fill="#0a0518"/>

  <text x="50" y="60" font-family="Cinzel Decorative, serif" font-size="24" letter-spacing="5" fill="#cc88ff">TYPOGRAPHY</text>
  <text x="50" y="88" font-family="Crimson Pro, serif" font-style="italic" font-size="14" fill="#7a5a99">Two voices. Display speaks the ancient. Body speaks the present.</text>

  <line x1="50" y1="110" x2="950" y2="110" stroke="#7a3acc" stroke-opacity="0.3"/>

  <!-- DISPLAY -->
  <text x="50" y="155" font-family="Cinzel, serif" font-size="11" letter-spacing="3" fill="#aa88dd">DISPLAY · CINZEL DECORATIVE</text>
  <text x="50" y="220" font-family="Cinzel Decorative, serif" font-size="60" font-weight="900" letter-spacing="6" fill="#cc88ff">INFINITEWORLDS</text>
  <text x="50" y="250" font-family="Crimson Pro, serif" font-size="13" fill="#7a5a99" font-style="italic">60px · weight 900 · letter-spacing 6 · for app titles, world names, modal headers</text>

  <text x="50" y="295" font-family="Cinzel Decorative, serif" font-size="32" font-weight="700" letter-spacing="4" fill="#cc88ff">THE WHISPERING GROVE</text>
  <text x="50" y="320" font-family="Crimson Pro, serif" font-size="13" fill="#7a5a99" font-style="italic">32px · weight 700 · letter-spacing 4 · for section titles</text>

  <text x="50" y="365" font-family="Cinzel, serif" font-size="14" letter-spacing="3" fill="#aa88dd" font-weight="400">SCALE · BIOME · WEATHER</text>
  <text x="50" y="385" font-family="Crimson Pro, serif" font-size="13" fill="#7a5a99" font-style="italic">14px · letter-spacing 3 · for badges, labels, small caps</text>

  <line x1="50" y1="420" x2="950" y2="420" stroke="#7a3acc" stroke-opacity="0.3"/>

  <!-- BODY -->
  <text x="50" y="460" font-family="Cinzel, serif" font-size="11" letter-spacing="3" fill="#aa88dd">BODY · CRIMSON PRO</text>

  <text x="50" y="500" font-family="Crimson Pro, serif" font-size="22" fill="#e0c8ff">
    The trees thin out, revealing a moss-covered stone door.
  </text>
  <text x="50" y="525" font-family="Crimson Pro, serif" font-size="13" fill="#7a5a99" font-style="italic">22px · regular · for environment narration</text>

  <text x="50" y="565" font-family="Crimson Pro, serif" font-style="italic" font-size="17" fill="#e0c8ff">
    "Oh, you want to go through THAT door? Last time someone touched those runes..."
  </text>
  <text x="50" y="590" font-family="Crimson Pro, serif" font-size="13" fill="#7a5a99" font-style="italic">17px · italic · for companion dialogue</text>

  <text x="50" y="625" font-family="Crimson Pro, serif" font-size="14" fill="#aa88dd">
    Examine the ancient runes carved into the doorframe.
  </text>
  <text x="50" y="648" font-family="Crimson Pro, serif" font-size="13" fill="#7a5a99" font-style="italic">14px · regular · for UI labels, task descriptions</text>

  <text x="50" y="680" font-family="Crimson Pro, serif" font-size="11" fill="#7a5a99" letter-spacing="2">SMALL TEXT FOR METADATA AND HINTS — 11PX UPPERCASE</text>
</svg>
