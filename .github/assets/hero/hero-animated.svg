<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <linearGradient id="bgHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0418">
        <animate attributeName="stop-color" values="#0a0418;#1a0838;#0a0418" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#2a1860">
        <animate attributeName="stop-color" values="#2a1860;#3a2880;#2a1860" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#5a3aa8">
        <animate attributeName="stop-color" values="#5a3aa8;#7a4ac8;#5a3aa8" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cc88ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#cc88ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cc88ff"><animate attributeName="stop-color" values="#cc88ff;#88ddff;#cc88ff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#fff"><animate attributeName="stop-color" values="#fff;#ffe0bb;#fff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#88ddff"><animate attributeName="stop-color" values="#88ddff;#cc88ff;#88ddff" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgHero)"/>
  <ellipse cx="600" cy="200" rx="500" ry="180" fill="url(#centerGlow)">
    <animate attributeName="rx" values="500;520;500" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- DRIFTING STARS -->
  <g fill="#fff">
    <circle cx="100" cy="80" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="120" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="60" r="1.2"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="100" r="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="80" r="1.3"><animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="140" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="70" r="1.5"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="120" r="1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="320" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="340" r="1.2"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="320" r="1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="340" r="1.3"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- DRIFTING PARTICLES (purple motes) -->
  <g fill="#cc88ff" opacity="0.7">
    <circle r="2" cx="100" cy="200">
      <animateMotion path="M 0 0 Q 200 -50 400 0 T 800 0 T 1100 0" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" cx="50" cy="250">
      <animateMotion path="M 0 0 Q 300 30 600 -10 T 1150 20" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="25s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" cx="0" cy="180">
      <animateMotion path="M 0 0 Q 250 -40 500 0 T 1200 0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- TITLE -->
  <g transform="translate(600 200)" text-anchor="middle">
    <text font-family="system-ui,-apple-system,sans-serif" font-size="80" font-weight="900" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="-2">
      InfiniteWorldAI
      <animate attributeName="font-size" values="80;82;80" dur="4s" repeatCount="indefinite"/>
    </text>
    <text y="50" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="500" fill="#fff" opacity="0.85" letter-spacing="3">
      VOICE-DRIVEN · AI-NATIVE · WHISPERS-TIER
    </text>
    <text y="90" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-style="italic" fill="#cc88ff" opacity="0.9">
      Never-ending stories. Lifelike companions. On your phone.
    </text>
  </g>

  <!-- AI STATUS BADGE (top-right, pulsing) -->
  <g transform="translate(1050 50)">
    <rect width="120" height="28" rx="14" fill="rgba(0,0,0,0.55)" stroke="#cc88ff"/>
    <circle cx="14" cy="14" r="5" fill="#cc88ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;6;5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="19" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">Claude Opus 4.7</text>
  </g>

  <!-- MIC WAVEFORM (bottom-left) -->
  <g transform="translate(80 350) " fill="#cc88ff">
    <rect x="0"  width="3" rx="1.5" y="-2"  height="4"><animate attributeName="height" values="4;20;4" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="-2;-10;-2" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="8"  width="3" rx="1.5" y="-6"  height="12"><animate attributeName="height" values="12;28;12" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="-6;-14;-6" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="16" width="3" rx="1.5" y="-10" height="20"><animate attributeName="height" values="20;36;20" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-10;-18;-10" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="24" width="3" rx="1.5" y="-14" height="28"><animate attributeName="height" values="28;44;28" dur="0.7s" repeatCount="indefinite"/><animate attributeName="y" values="-14;-22;-14" dur="0.7s" repeatCount="indefinite"/></rect>
    <rect x="32" width="3" rx="1.5" y="-8"  height="16"><animate attributeName="height" values="16;32;16" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-16;-8" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="40" width="3" rx="1.5" y="-12" height="24"><animate attributeName="height" values="24;40;24" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="-12;-20;-12" dur="0.8s" repeatCount="indefinite"/></rect>
    <rect x="48" width="3" rx="1.5" y="-4"  height="8"><animate attributeName="height" values="8;22;8" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="-4;-11;-4" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="56" width="3" rx="1.5" y="-10" height="20"><animate attributeName="height" values="20;30;20" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="-10;-15;-10" dur="1.0s" repeatCount="indefinite"/></rect>
    <rect x="64" width="3" rx="1.5" y="-2"  height="4"><animate attributeName="height" values="4;18;4" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="-2;-9;-2" dur="1.2s" repeatCount="indefinite"/></rect>
  </g>
  <text x="160" y="360" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#cc88ff" letter-spacing="2">STELLA · SPEAKING</text>
</svg>
