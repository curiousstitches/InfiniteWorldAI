    <path d="M -50 0 Q 0 -35 50 0 Q 0 35 -50 0 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <text x="640" y="450" text-anchor="middle" font-family="Cinzel Decorative, serif"
