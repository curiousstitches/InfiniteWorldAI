<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="ogBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0a3a"/>
      <stop offset="50%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
    <radialGradient id="ogNeb" cx="80%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#7a3acc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7a3acc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ogNeb2" cx="15%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#ff44aa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff44aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ogVoid" cx="50%" cy="50%" r="50%">
