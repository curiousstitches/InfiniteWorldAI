      <stop offset="100%" stop-color="#cc88ff"/>
    </linearGradient>
    <filter id="ogGlow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#ogBg)"/>
