<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%">
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0418"/>
      <stop offset="100%" stop-color="#1a0838"/>
    </linearGradient>
    <radialGradient id="nodeGlow1"><stop offset="0%" stop-color="#88dd66" stop-opacity="0.6"/><stop offset="100%" stop-color="#88dd66" stop-opacity="0"/></radialGradient>
    <radialGradient id="nodeGlow2"><stop offset="0%" stop-color="#cc88ff" stop-opacity="0.6"/><stop offset="100%" stop-color="#cc88ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="nodeGlow3"><stop offset="0%" stop-color="#88ddff" stop-opacity="0.6"/><stop offset="100%" stop-color="#88ddff" stop-opacity="0"/></radialGradient>
    <radialGradient id="nodeGlow4"><stop offset="0%" stop-color="#ffcc66" stop-opacity="0.6"/><stop offset="100%" stop-color="#ffcc66" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#flowBg)" rx="20"/>

  <!-- Connecting line/path between all 4 nodes -->
  <path d="M 180 140 L 420 140 L 660 140 L 900 140 L 1020 140" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none" stroke-dasharray="6 6"/>

  <!-- Flowing particles along the path (cycle visualization) -->
  <g>
    <circle r="5" fill="#cc88ff" filter="url(#blur)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 180 140 L 420 140 L 660 140 L 900 140"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#88ddff">
      <animateMotion dur="6s" repeatCount="indefinite" begin="2s" path="M 180 140 L 420 140 L 660 140 L 900 140"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#88dd66">
      <animateMotion dur="6s" repeatCount="indefinite" begin="4s" path="M 180 140 L 420 140 L 660 140 L 900 140"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" begin="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Node 1 — Voice Input -->
  <g transform="translate(180 140)">
    <ellipse rx="60" ry="60" fill="url(#nodeGlow1)"><animate attributeName="rx" values="60;70;60" dur="2s" repeatCount="indefinite"/><animate attributeName="ry" values="60;70;60" dur="2s" repeatCount="indefinite"/></ellipse>
    <circle r="42" fill="#1a3018" stroke="#88dd66" stroke-width="2"/>
    <text y="6" font-size="28" text-anchor="middle">🎙</text>
    <text y="80" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#88dd66" text-anchor="middle">VOICE</text>
    <text y="98" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Whisper STT</text>
  </g>

  <!-- Node 2 — Multi-agent LLM -->
  <g transform="translate(420 140)">
    <ellipse rx="60" ry="60" fill="url(#nodeGlow2)"><animate attributeName="rx" values="60;75;60" dur="2.5s" repeatCount="indefinite"/><animate attributeName="ry" values="60;75;60" dur="2.5s" repeatCount="indefinite"/></ellipse>
    <circle r="42" fill="#28104a" stroke="#cc88ff" stroke-width="2"/>
    <text y="6" font-size="28" text-anchor="middle">🧠</text>
    <text y="80" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#cc88ff" text-anchor="middle">AI CASCADE</text>
    <text y="98" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">GM · Companion · Task</text>
  </g>

  <!-- Node 3 — World -->
  <g transform="translate(660 140)">
    <ellipse rx="60" ry="60" fill="url(#nodeGlow3)"><animate attributeName="rx" values="60;72;60" dur="2.2s" repeatCount="indefinite"/><animate attributeName="ry" values="60;72;60" dur="2.2s" repeatCount="indefinite"/></ellipse>
    <circle r="42" fill="#0a3050" stroke="#88ddff" stroke-width="2"/>
    <text y="6" font-size="28" text-anchor="middle">🌌</text>
    <text y="80" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#88ddff" text-anchor="middle">WORLD MORPHS</text>
    <text y="98" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Babylon.js · WebGPU</text>
  </g>

  <!-- Node 4 — TTS -->
  <g transform="translate(900 140)">
    <ellipse rx="60" ry="60" fill="url(#nodeGlow4)"><animate attributeName="rx" values="60;68;60" dur="1.8s" repeatCount="indefinite"/><animate attributeName="ry" values="60;68;60" dur="1.8s" repeatCount="indefinite"/></ellipse>
    <circle r="42" fill="#3a2810" stroke="#ffcc66" stroke-width="2"/>
    <text y="6" font-size="28" text-anchor="middle">🔊</text>
    <text y="80" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#ffcc66" text-anchor="middle">SPEECH OUT</text>
    <text y="98" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">ElevenLabs Turbo</text>
  </g>

  <!-- Cycle arrow back to start -->
  <path d="M 960 140 Q 1080 140 1080 70 Q 1080 20 600 20 Q 120 20 120 70 Q 120 140 180 140" stroke="rgba(204,136,255,0.3)" stroke-width="2" fill="none" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="2s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="42" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="rgba(204,136,255,0.7)" letter-spacing="2" text-anchor="middle">·  CONTINUOUS LOOP  ·</text>

  <!-- Latency badges underneath -->
  <text x="180" y="240" font-family="system-ui,sans-serif" font-size="10" fill="rgba(136,221,102,0.7)" text-anchor="middle">~300ms</text>
  <text x="420" y="240" font-family="system-ui,sans-serif" font-size="10" fill="rgba(204,136,255,0.7)" text-anchor="middle">~800ms</text>
  <text x="660" y="240" font-family="system-ui,sans-serif" font-size="10" fill="rgba(136,221,255,0.7)" text-anchor="middle">~60fps</text>
  <text x="900" y="240" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,204,102,0.7)" text-anchor="middle">~400ms first byte</text>
</svg>
