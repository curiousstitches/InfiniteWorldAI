<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="440" height="900">
  <defs>
    <radialGradient id="cosmos" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a0a3a"/>
      <stop offset="40%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
    <radialGradient id="nebula" cx="60%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#7a3acc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7a3acc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="25%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#ff44aa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff44aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect x="0" y="0" width="440" height="900" rx="60" fill="#000" stroke="#222" stroke-width="2"/>
  <clipPath id="screen"><rect x="10" y="10" width="420" height="880" rx="50"/></clipPath>

  <g clip-path="url(#screen)">
    <rect x="10" y="10" width="420" height="880" fill="url(#cosmos)"/>
    <rect x="10" y="10" width="420" height="880" fill="url(#nebula)"/>
    <rect x="10" y="10" width="420" height="880" fill="url(#nebula2)"/>

    <!-- Stars (3000 simulated) -->
    <g fill="#ffffff">
      <circle cx="40" cy="80" r="0.8" opacity="0.9"/>
      <circle cx="80" cy="120" r="0.5" opacity="0.7"/>
      <circle cx="130" cy="60" r="1.2" opacity="0.95"/>
      <circle cx="200" cy="140" r="0.6" opacity="0.8"/>
      <circle cx="280" cy="90" r="0.9" opacity="0.85"/>
      <circle cx="350" cy="130" r="0.7" opacity="0.75"/>
      <circle cx="60" cy="200" r="0.6" opacity="0.8"/>
      <circle cx="170" cy="220" r="1.0" opacity="0.9"/>
      <circle cx="240" cy="180" r="0.5" opacity="0.7"/>
      <circle cx="320" cy="240" r="0.8" opacity="0.85"/>
      <circle cx="400" cy="190" r="1.3" opacity="0.95"/>
      <circle cx="30" cy="280" r="0.7" opacity="0.75"/>
      <circle cx="100" cy="310" r="1.1" opacity="0.9"/>
      <circle cx="180" cy="290" r="0.5" opacity="0.7"/>
      <circle cx="260" cy="330" r="0.9" opacity="0.85"/>
      <circle cx="380" cy="280" r="0.6" opacity="0.8"/>
      <circle cx="50" cy="400" r="1.0" opacity="0.9"/>
      <circle cx="140" cy="380" r="0.7" opacity="0.8"/>
      <circle cx="230" cy="420" r="0.6" opacity="0.75"/>
      <circle cx="320" cy="380" r="1.2" opacity="0.95"/>
      <circle cx="400" cy="430" r="0.5" opacity="0.7"/>
      <circle cx="80" cy="480" r="0.8" opacity="0.85"/>
      <circle cx="200" cy="520" r="0.6" opacity="0.75"/>
      <circle cx="290" cy="470" r="0.9" opacity="0.9"/>
      <circle cx="360" cy="510" r="0.7" opacity="0.8"/>
      <circle cx="40" cy="580" r="1.0" opacity="0.9"/>
      <circle cx="150" cy="600" r="0.5" opacity="0.7"/>
      <circle cx="250" cy="570" r="0.8" opacity="0.85"/>
      <circle cx="340" cy="620" r="1.1" opacity="0.95"/>
    </g>

    <!-- Distant planet -->
    <circle cx="290" cy="280" r="50" fill="#3a1060" opacity="0.85"/>
    <circle cx="290" cy="280" r="50" fill="url(#planetShade)" opacity="0.7"/>
    <defs>
      <radialGradient id="planetShade" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#ff88cc" stop-opacity="0.4"/>
        <stop offset="60%" stop-color="#3a1060" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
      </radialGradient>
    </defs>
    <ellipse cx="290" cy="280" rx="70" ry="8" fill="none" stroke="#cc88ff" stroke-width="0.8" opacity="0.5"/>

    <!-- Distant nebula wisp -->
    <ellipse cx="150" cy="450" rx="80" ry="35" fill="#ff44aa" filter="url(#glow)" opacity="0.2"/>
    <ellipse cx="150" cy="450" rx="40" ry="18" fill="#cc88ff" filter="url(#glow)" opacity="0.3"/>

    <!-- Floating cosmic companion -->
    <g transform="translate(220 500)">
      <ellipse cx="0" cy="40" rx="14" ry="20" fill="#5a3a8a" opacity="0.85"/>
      <circle cx="0" cy="10" r="11" fill="#7a4abf"/>
      <circle cx="-3" cy="9" r="1.5" fill="#ffeeff" filter="url(#glow)"/>
      <circle cx="3" cy="9" r="1.5" fill="#ffeeff" filter="url(#glow)"/>
      <ellipse cx="-12" cy="34" rx="3" ry="9" fill="#5a3a8a" opacity="0.85"/>
      <ellipse cx="12" cy="34" rx="3" ry="9" fill="#5a3a8a" opacity="0.85"/>
      <circle cx="0" cy="25" r="50" fill="#7a4abf" filter="url(#glow)" opacity="0.2"/>
    </g>
  </g>

  <!-- HUD overlay -->
  <text x="40" y="48" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#cc88ff">9:41</text>
  <rect x="180" y="20" width="80" height="28" rx="14" fill="#000"/>

  <text x="30" y="86" font-family="Crimson Pro, serif" font-style="italic" font-size="14" fill="#dcc8ff">The Last Star</text>
  <circle cx="408" cy="80" r="18" fill="rgba(10,5,30,0.7)" stroke="#7a3acc" stroke-opacity="0.4"/>
  <text x="408" y="86" text-anchor="middle" font-family="Cinzel, serif" font-size="13" fill="#aa88dd">◈</text>

  <g transform="translate(30 100)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(20,10,50,0.6)" stroke="#7a3acc" stroke-opacity="0.3"/>
    <text x="31" y="14" text-anchor="middle" font-family="Cinzel, serif" font-size="9" letter-spacing="1" fill="#cc88ff">✦ COSMIC</text>

    <rect x="68" y="0" width="60" height="20" rx="10" fill="rgba(20,10,50,0.6)" stroke="#7a3acc" stroke-opacity="0.3"/>
    <text x="98" y="14" text-anchor="middle" font-family="Cinzel, serif" font-size="9" letter-spacing="1" fill="#aa88dd">COSMIC</text>

    <rect x="134" y="0" width="56" height="20" rx="10" fill="rgba(20,10,50,0.6)" stroke="#7a3acc" stroke-opacity="0.3"/>
    <text x="162" y="14" text-anchor="middle" font-family="Cinzel, serif" font-size="9" letter-spacing="1" fill="#aa88dd">AURORA</text>
  </g>

  <!-- Scale shift indicator overlay -->
  <g transform="translate(220 220)" opacity="0.9">
    <rect x="-90" y="0" width="180" height="38" rx="19" fill="rgba(100,20,200,0.4)" stroke="#cc88ff" stroke-width="0.5"/>
    <text x="0" y="23" text-anchor="middle" font-family="Cinzel, serif" font-size="10" letter-spacing="3" fill="#ffffff">⤴ SCALE SHIFT · COSMIC</text>
  </g>

  <!-- Long subtitles -->
  <g transform="translate(220 700)">
    <rect x="-180" y="0" width="360" height="60" rx="20" fill="rgba(0,0,0,0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="0" y="22" text-anchor="middle" font-family="Crimson Pro, serif" font-size="13" fill="#96dcff">
      "...you really brought us all the way out here just to"
    </text>
    <text x="0" y="42" text-anchor="middle" font-family="Crimson Pro, serif" font-size="13" fill="#96dcff">
      "stand in front of a dying star? Bold move." ▪▪
    </text>
  </g>

  <!-- Voice control row -->
  <g transform="translate(220 830)">
    <circle cx="-58" cy="0" r="20" fill="rgba(30,20,60,0.85)" stroke="rgba(255,255,255,0.1)"/>
    <text x="-58" y="5" text-anchor="middle" font-family="Cinzel, serif" font-size="14" fill="#c8a8e8">⌨</text>

    <circle cx="0" cy="0" r="32" fill="#3c0a8e" stroke="#80c8ff" stroke-width="1"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#80c8ff" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#80c8ff" stroke-width="1" opacity="0.2"/>
    <text x="0" y="9" text-anchor="middle" font-family="Cinzel, serif" font-size="24" fill="#ffffff">◈</text>

    <circle cx="58" cy="0" r="20" fill="rgba(30,20,60,0.85)" stroke="rgba(255,255,255,0.1)"/>
    <text x="58" y="5" text-anchor="middle" font-family="Cinzel, serif" font-size="14" fill="#c8a8e8">✕</text>
  </g>

  <text x="220" y="875" text-anchor="middle" font-family="Cinzel, serif" font-size="9" letter-spacing="2" fill="#7a5a99">COMPANION SPEAKING</text>

  <rect x="160" y="887" width="120" height="3" rx="1.5" fill="#cc88ff" opacity="0.3"/>
</svg>
