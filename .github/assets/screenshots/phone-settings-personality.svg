      <text x="328" y="10" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#cc88ff" text-anchor="end">34</text>
      <rect x="0" y="16" width="328" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
      <rect x="0" y="16" width="111" height="4" rx="2" fill="#cc88ff"/>
      <circle cx="111" cy="18" r="7" fill="#fff"/>
    </g>
    <g transform="translate(16 134)">
      <text x="0" y="10" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#f0e8ff">✨ Extraversion</text>
      <text x="328" y="10" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#cc88ff" text-anchor="end">61</text>
      <rect x="0" y="16" width="328" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
      <rect x="0" y="16" width="200" height="4" rx="2" fill="#cc88ff"/>
      <circle cx="200" cy="18" r="7" fill="#fff"/>
    </g>
    <g transform="translate(16 180)">
