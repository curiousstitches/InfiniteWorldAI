<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="440" height="900">
  <defs>
    <linearGradient id="phoneBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="bgR" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#050008"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc88ff"/>
      <stop offset="100%" stop-color="#7a3acc"/>
    </linearGradient>
    <linearGradient id="sliderTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cc88ff"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="440" height="900" rx="60" fill="url(#phoneBezel)"/>
  <rect x="10" y="10" width="420" height="880" rx="50" fill="#000"/>
  <rect x="20" y="20" width="400" height="860" rx="42" fill="url(#bgR)"/>

  <!-- Status bar -->
  <text x="50" y="55" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">9:42</text>
  <g transform="translate(360 42)">
    <rect width="18" height="11" rx="2" fill="none" stroke="#fff" stroke-width="1"/>
    <rect x="2" y="2" width="14" height="7" fill="#fff"/>
    <rect x="20" y="1" width="2" height="9" rx="1" fill="#fff"/>
  </g>
  <rect x="170" y="35" width="100" height="28" rx="14" fill="#000"/>

  <!-- Header -->
  <g transform="translate(40 90)">
    <text x="0" y="14" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#cc88ff" letter-spacing="2">SETTINGS</text>
    <circle cx="320" cy="6" r="16" fill="none" stroke="rgba(204,136,255,0.4)"/>
    <text x="320" y="11" font-family="system-ui,sans-serif" font-size="16" fill="#f0e8ff" text-anchor="middle">×</text>
  </g>

  <!-- Tabs (Personality active) -->
  <g transform="translate(40 122)">
    <rect width="113" height="34" rx="8" fill="rgba(204,136,255,0.08)"/>
    <text x="56" y="22" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#f0e8ff" text-anchor="middle">🔑 API</text>
    <rect x="121" width="113" height="34" rx="8" fill="url(#accent)"/>
    <text x="177" y="22" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#0a0218" text-anchor="middle">🧠 Personality</text>
    <rect x="242" width="113" height="34" rx="8" fill="rgba(204,136,255,0.08)"/>
    <text x="298" y="22" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#f0e8ff" text-anchor="middle">✨ Interface</text>
  </g>

  <!-- Basic / Detailed toggle -->
  <g transform="translate(40 175)">
    <rect width="360" height="42" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(204,136,255,0.25)"/>
    <rect x="4" y="4" width="174" height="34" rx="8" fill="rgba(204,136,255,0.08)"/>
    <text x="91" y="26" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#f0e8ff" text-anchor="middle">Basic</text>
    <rect x="182" y="4" width="174" height="34" rx="8" fill="url(#accent)"/>
    <text x="269" y="26" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#0a0218" text-anchor="middle">Detailed</text>
  </g>

