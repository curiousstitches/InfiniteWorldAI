      <text x="328" y="10" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#cc88ff" text-anchor="end">28</text>
      <rect x="0" y="16" width="328" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
      <rect x="0" y="16" width="91" height="4" rx="2" fill="#cc88ff"/>
      <circle cx="91" cy="18" r="7" fill="#fff"/>
    </g>
    <g transform="translate(16 226)">
      <text x="0" y="10" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#f0e8ff">🌊 Emotional Volatility</text>
      <text x="328" y="10" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#cc88ff" text-anchor="end">71</text>
      <rect x="0" y="16" width="328" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
      <rect x="0" y="16" width="233" height="4" rx="2" fill="#cc88ff"/>
      <circle cx="233" cy="18" r="7" fill="#fff"/>
    </g>
  </g>

