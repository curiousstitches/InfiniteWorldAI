    <rect width="360" height="280" rx="14" fill="rgba(204,136,255,0.06)" stroke="rgba(204,136,255,0.2)"/>
    <text x="16" y="22" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#cc88ff" letter-spacing="0.5">Core Personality (OCEAN) <tspan font-size="8" fill="rgba(240,232,255,0.4)">BASIC</tspan></text>
    <rect x="280" y="8" width="62" height="22" rx="6" fill="rgba(136,221,255,0.15)" stroke="rgba(136,221,255,0.4)"/>
    <text x="311" y="22" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#88ddff" text-anchor="middle">🎲 Randomize</text>

