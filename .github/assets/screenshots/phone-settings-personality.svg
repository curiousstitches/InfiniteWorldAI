      <rect x="60" y="4" width="100" height="3" rx="1.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="60" y="4" width="88" height="3" rx="1.5" fill="#cc88ff"/>
      <text x="170" y="10" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#cc88ff">88</text>
      <text x="200" y="10" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#f0e8ff">😈 Mischief</text>
      <rect x="260" y="4" width="60" height="3" rx="1.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="260" y="4" width="51" height="3" rx="1.5" fill="#cc88ff"/>
      <text x="328" y="10" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#cc88ff">85</text>
    </g>
    <g transform="translate(16 60)">
      <text x="0" y="10" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#f0e8ff">💞 Empathy</text>
      <rect x="60" y="4" width="100" height="3" rx="1.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="60" y="4" width="22" height="3" rx="1.5" fill="#cc88ff"/>
      <text x="170" y="10" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#cc88ff">22</text>
      <text x="200" y="10" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#f0e8ff">🌧 Melancholy</text>
      <rect x="260" y="4" width="60" height="3" rx="1.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="260" y="4" width="44" height="3" rx="1.5" fill="#cc88ff"/>
      <text x="328" y="10" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#cc88ff">73</text>
    </g>
    <g transform="translate(16 82)">
      <text x="0" y="10" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#f0e8ff">🔭 Curiosity</text>
      <rect x="60" y="4" width="100" height="3" rx="1.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="60" y="4" width="94" height="3" rx="1.5" fill="#cc88ff"/>
      <text x="170" y="10" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#cc88ff">94</text>
      <text x="200" y="10" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#f0e8ff">🎈 Playfulness</text>
      <rect x="260" y="4" width="60" height="3" rx="1.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="260" y="4" width="46" height="3" rx="1.5" fill="#cc88ff"/>
      <text x="328" y="10" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#cc88ff">76</text>
