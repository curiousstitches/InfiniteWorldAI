      <rect x="0" y="16" width="328" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
      <rect x="0" y="16" width="269" height="4" rx="2" fill="#cc88ff"/>
      <circle cx="269" cy="18" r="7" fill="#fff"/>
