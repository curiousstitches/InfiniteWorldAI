    <text x="16" y="22" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#cc88ff" letter-spacing="0.5">Identity <tspan font-size="8" fill="rgba(240,232,255,0.4)">BASIC</tspan></text>
    <rect x="280" y="8" width="62" height="22" rx="6" fill="rgba(136,221,255,0.15)" stroke="rgba(136,221,255,0.4)"/>
    <text x="311" y="22" font-family="system-ui,sans-serif" font-size="8" font-weight="700" fill="#88ddff" text-anchor="middle">🎲 Randomize</text>

    <text x="16" y="44" font-family="system-ui,sans-serif" font-size="9" fill="#f0e8ff" font-weight="600">Name</text>
    <rect x="16" y="48" width="328" height="28" rx="8" fill="rgba(0,0,0,0.5)" stroke="rgba(204,136,255,0.3)"/>
    <text x="26" y="66" font-family="'Crimson Pro', serif" font-size="13" fill="#cc88ff" font-style="italic">Mossglow</text>

    <text x="16" y="92" font-family="system-ui,sans-serif" font-size="9" fill="#f0e8ff" font-weight="600">Vibe (free-form)</text>
    <rect x="16" y="96" width="328" height="20" rx="6" fill="rgba(0,0,0,0.5)" stroke="rgba(204,136,255,0.3)"/>
    <text x="26" y="110" font-family="system-ui,sans-serif" font-size="10" fill="rgba(240,232,255,0.7)" font-style="italic">a sarcastic moth-girl who hums to crystals…</text>
