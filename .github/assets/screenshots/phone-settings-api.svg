<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="440" height="900">
  <defs>
    <linearGradient id="phoneBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="bgR" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#050008"/>
    </radialGradient>
    <linearGradient id="ddBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.55)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc88ff"/>
      <stop offset="100%" stop-color="#7a3acc"/>
    </linearGradient>
  </defs>

  <!-- iPhone frame -->
  <rect x="0" y="0" width="440" height="900" rx="60" fill="url(#phoneBezel)"/>
  <rect x="10" y="10" width="420" height="880" rx="50" fill="#000"/>
  <rect x="20" y="20" width="400" height="860" rx="42" fill="url(#bgR)"/>

  <!-- Status bar -->
  <text x="50" y="55" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">9:42</text>
  <g transform="translate(360 42)">
    <rect x="0" y="0" width="18" height="11" rx="2" fill="none" stroke="#fff" stroke-width="1"/>
    <rect x="2" y="2" width="14" height="7" fill="#fff"/>
    <rect x="20" y="1" width="2" height="9" rx="1" fill="#fff"/>
  </g>
  <!-- Dynamic island -->
  <rect x="170" y="35" width="100" height="28" rx="14" fill="#000"/>

  <!-- Settings header -->
  <g transform="translate(40 90)">
    <text x="0" y="14" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#cc88ff" letter-spacing="2">SETTINGS</text>
    <circle cx="320" cy="6" r="16" fill="none" stroke="rgba(204,136,255,0.4)" stroke-width="1"/>
    <text x="320" y="11" font-family="system-ui,sans-serif" font-size="16" fill="#f0e8ff" text-anchor="middle">×</text>
  </g>

  <!-- Tab strip -->
  <g transform="translate(40 122)">
    <rect width="113" height="34" rx="8" fill="url(#accent)"/>
    <text x="56" y="22" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#0a0218" text-anchor="middle">🔑 API</text>
    <rect x="121" width="113" height="34" rx="8" fill="rgba(204,136,255,0.08)"/>
    <text x="177" y="22" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#f0e8ff" text-anchor="middle">🧠 Personality</text>
    <rect x="242" width="113" height="34" rx="8" fill="rgba(204,136,255,0.08)"/>
    <text x="298" y="22" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#f0e8ff" text-anchor="middle">✨ Interface</text>
  </g>

  <!-- PROVIDERS section -->
  <g transform="translate(40 180)">
    <rect width="360" height="320" rx="14" fill="rgba(204,136,255,0.06)" stroke="rgba(204,136,255,0.2)"/>
    <text x="16" y="22" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#cc88ff" letter-spacing="1">PROVIDERS · per-agent</text>
    <text x="16" y="36" font-family="system-ui,sans-serif" font-size="9" fill="rgba(240,232,255,0.7)">Sorted best→worst. Locked items need a key.</text>

    <!-- Companion row -->
    <text x="16" y="58" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">🤝 Companion</text>
    <rect x="16" y="64" width="328" height="34" rx="10" fill="url(#ddBg)" stroke="rgba(204,136,255,0.3)"/>
    <rect x="22" y="72" width="14" height="14" rx="3" fill="#cc88ff"/>
    <text x="28" y="83" font-family="system-ui,sans-serif" font-size="9" font-weight="800" fill="#0a0218" text-anchor="middle">S</text>
    <text x="42" y="85" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#f0e8ff">Claude Opus 4.7 (Puter)</text>
    <text x="336" y="85" font-family="system-ui,sans-serif" font-size="10" fill="#cc88ff" text-anchor="end">▼</text>

    <!-- GM row -->
    <text x="16" y="120" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">🌍 World GM</text>
    <rect x="16" y="126" width="328" height="34" rx="10" fill="url(#ddBg)" stroke="rgba(204,136,255,0.3)"/>
    <rect x="22" y="134" width="14" height="14" rx="3" fill="#88ddff"/>
    <text x="28" y="145" font-family="system-ui,sans-serif" font-size="9" font-weight="800" fill="#0a0218" text-anchor="middle">A</text>
    <text x="42" y="147" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#f0e8ff">Gemini 3.5 Flash (Puter)</text>
    <text x="336" y="147" font-family="system-ui,sans-serif" font-size="10" fill="#cc88ff" text-anchor="end">▼</text>

    <!-- TaskGen row -->
    <text x="16" y="182" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">⚡ Task Gen</text>
    <rect x="16" y="188" width="328" height="34" rx="10" fill="url(#ddBg)" stroke="rgba(204,136,255,0.3)"/>
    <rect x="22" y="196" width="14" height="14" rx="3" fill="#88dd66"/>
    <text x="28" y="207" font-family="system-ui,sans-serif" font-size="9" font-weight="800" fill="#0a0218" text-anchor="middle">B</text>
    <text x="42" y="209" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#f0e8ff">Groq Llama 3.3 70B</text>
    <text x="336" y="209" font-family="system-ui,sans-serif" font-size="10" fill="#cc88ff" text-anchor="end">▼</text>

    <!-- STT row -->
    <text x="16" y="244" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">🎤 Voice In</text>
    <rect x="16" y="250" width="328" height="34" rx="10" fill="url(#ddBg)" stroke="rgba(204,136,255,0.3)"/>
    <rect x="22" y="258" width="14" height="14" rx="3" fill="#88dd66"/>
    <text x="28" y="269" font-family="system-ui,sans-serif" font-size="9" font-weight="800" fill="#0a0218" text-anchor="middle">B</text>
    <text x="42" y="271" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#f0e8ff">Web Speech (browser, free)</text>
    <text x="336" y="271" font-family="system-ui,sans-serif" font-size="10" fill="#cc88ff" text-anchor="end">▼</text>
  </g>

  <!-- API KEYS section -->
  <g transform="translate(40 520)">
    <rect width="360" height="160" rx="14" fill="rgba(204,136,255,0.06)" stroke="rgba(204,136,255,0.2)"/>
    <text x="16" y="22" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#cc88ff" letter-spacing="1">API KEYS · free tiers</text>
    <text x="16" y="36" font-family="system-ui,sans-serif" font-size="9" fill="rgba(240,232,255,0.7)">Stored locally. Unlocks server-side providers.</text>

    <!-- Groq filled -->
    <g transform="translate(16 50)">
      <text x="0" y="14" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#f0e8ff">Groq</text>
      <rect x="60" y="0" width="220" height="22" rx="6" fill="rgba(0,0,0,0.55)" stroke="rgba(204,136,255,0.25)"/>
      <text x="68" y="15" font-family="monospace" font-size="9" fill="#88dd66">●●●●●●●●●●●●●●●●●</text>
      <text x="290" y="14" font-family="system-ui,sans-serif" font-size="8" fill="#88ddff">get →</text>
    </g>
    <!-- Google AI empty -->
    <g transform="translate(16 78)">
      <text x="0" y="14" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#f0e8ff">Google AI</text>
      <rect x="60" y="0" width="220" height="22" rx="6" fill="rgba(0,0,0,0.55)" stroke="rgba(204,136,255,0.25)"/>
      <text x="68" y="15" font-family="monospace" font-size="9" fill="rgba(204,136,255,0.5)" font-style="italic">paste key…</text>
      <text x="290" y="14" font-family="system-ui,sans-serif" font-size="8" fill="#88ddff">get →</text>
    </g>
    <!-- OpenRouter filled -->
    <g transform="translate(16 106)">
      <text x="0" y="14" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#f0e8ff">OpenRouter</text>
      <rect x="60" y="0" width="220" height="22" rx="6" fill="rgba(0,0,0,0.55)" stroke="rgba(204,136,255,0.25)"/>
      <text x="68" y="15" font-family="monospace" font-size="9" fill="#88dd66">●●●●●●●●●●●●●●●●●</text>
      <text x="290" y="14" font-family="system-ui,sans-serif" font-size="8" fill="#88ddff">get →</text>
    </g>
    <!-- Mistral empty -->
    <g transform="translate(16 134)">
      <text x="0" y="14" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#f0e8ff">Mistral</text>
      <rect x="60" y="0" width="220" height="22" rx="6" fill="rgba(0,0,0,0.55)" stroke="rgba(204,136,255,0.25)"/>
      <text x="68" y="15" font-family="monospace" font-size="9" fill="rgba(204,136,255,0.5)" font-style="italic">paste key…</text>
      <text x="290" y="14" font-family="system-ui,sans-serif" font-size="8" fill="#88ddff">get →</text>
    </g>
  </g>

  <!-- Tier legend chip strip -->
  <g transform="translate(40 700)">
    <text x="0" y="0" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="rgba(204,136,255,0.7)" letter-spacing="1.5">TIER COLOR LEGEND</text>
    <g transform="translate(0 8)">
      <rect width="62" height="22" rx="11" fill="rgba(0,0,0,0.55)" stroke="#cc88ff"/>
      <circle cx="14" cy="11" r="4" fill="#cc88ff"/>
      <text x="22" y="15" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff">S · Top</text>
    </g>
    <g transform="translate(70 8)">
      <rect width="62" height="22" rx="11" fill="rgba(0,0,0,0.55)" stroke="#88ddff"/>
      <circle cx="14" cy="11" r="4" fill="#88ddff"/>
      <text x="22" y="15" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff">A · High</text>
    </g>
    <g transform="translate(140 8)">
      <rect width="62" height="22" rx="11" fill="rgba(0,0,0,0.55)" stroke="#88dd66"/>
      <circle cx="14" cy="11" r="4" fill="#88dd66"/>
      <text x="22" y="15" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff">B · Fast</text>
    </g>
    <g transform="translate(210 8)">
      <rect width="62" height="22" rx="11" fill="rgba(0,0,0,0.55)" stroke="#ffcc66"/>
      <circle cx="14" cy="11" r="4" fill="#ffcc66"/>
      <text x="22" y="15" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff">C · Fall</text>
    </g>
    <g transform="translate(280 8)">
      <rect width="62" height="22" rx="11" fill="rgba(0,0,0,0.55)" stroke="#ff6666"/>
      <circle cx="14" cy="11" r="4" fill="#ff6666"/>
      <text x="22" y="15" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff">E · Emrg</text>
    </g>
  </g>

  <!-- Home indicator -->
  <rect x="170" y="850" width="100" height="4" rx="2" fill="#fff" opacity="0.5"/>
</svg>
