<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="440" height="900">
  <defs>
    <linearGradient id="phoneBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a14"/>
      <stop offset="50%" stop-color="#1f4030"/>
      <stop offset="100%" stop-color="#040a07"/>
    </linearGradient>
    <radialGradient id="ground" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#1a3320"/>
      <stop offset="100%" stop-color="#050a06"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#88dd66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(10,5,20,0.92)"/>
      <stop offset="100%" stop-color="rgba(10,5,20,0.85)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc88ff"/>
      <stop offset="100%" stop-color="#7a3acc"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="440" height="900" rx="60" fill="url(#phoneBezel)"/>
  <rect x="10" y="10" width="420" height="880" rx="50" fill="#000"/>
  <!-- Screen -->
  <rect x="20" y="20" width="400" height="860" rx="42" fill="url(#sky)"/>
  <ellipse cx="300" cy="220" rx="110" ry="70" fill="url(#halo)"/>

  <!-- Mountain silhouettes -->
  <polygon points="20,420 80,360 140,400 200,340 260,390 320,360 380,400 420,380 420,500 20,500" fill="#0c1f15"/>
  <!-- Trees -->
  <g opacity="0.85">
    <polygon points="50,560 70,420 90,560" fill="#051208"/>
    <polygon points="100,580 125,400 150,580" fill="#061a0c"/>
    <polygon points="290,570 315,410 340,570" fill="#061a0c"/>
    <polygon points="350,585 375,420 400,585" fill="#051208"/>
  </g>
  <!-- Ground -->
  <rect x="20" y="500" width="400" height="380" fill="url(#ground)"/>

  <!-- Mushroom glows -->
  <g opacity="0.8">
    <circle cx="70" cy="680" r="6" fill="#cc88ff"/>
    <circle cx="130" cy="710" r="5" fill="#88ddff"/>
    <circle cx="350" cy="700" r="7" fill="#cc88ff"/>
    <circle cx="385" cy="730" r="4" fill="#cc88ff"/>
  </g>

  <!-- Status bar -->
  <text x="50" y="55" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">9:42</text>
  <g transform="translate(360 42)">
    <rect width="18" height="11" rx="2" fill="none" stroke="#fff" stroke-width="1"/>
    <rect x="2" y="2" width="14" height="7" fill="#fff"/>
    <rect x="20" y="1" width="2" height="9" rx="1" fill="#fff"/>
  </g>
  <rect x="170" y="35" width="100" height="28" rx="14" fill="#000"/>

  <!-- AI STATUS PANEL (expanded) — top right -->
  <g transform="translate(192 90)" filter="drop-shadow(0 4px 24px rgba(0,0,0,0.6))">
    <rect width="210" height="200" rx="12" fill="url(#panelBg)" stroke="rgba(204,136,255,0.4)"/>

    <!-- Companion row -->
    <g transform="translate(12 18)">
      <circle cx="6" cy="6" r="4" fill="#cc88ff"/>
      <text x="18" y="9" font-family="system-ui,sans-serif" font-size="9" fill="rgba(240,232,255,0.7)">🤝 Companion</text>
      <text x="198" y="9" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="end">Claude Opus 4.7</text>
    </g>
    <!-- GM row -->
    <g transform="translate(12 38)">
      <circle cx="6" cy="6" r="4" fill="#88ddff"/>
      <text x="18" y="9" font-family="system-ui,sans-serif" font-size="9" fill="rgba(240,232,255,0.7)">🌍 GM</text>
      <text x="198" y="9" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="end">Gemini 3.5 Flash</text>
    </g>
    <!-- TaskGen row -->
    <g transform="translate(12 58)">
      <circle cx="6" cy="6" r="4" fill="#88dd66"/>
      <text x="18" y="9" font-family="system-ui,sans-serif" font-size="9" fill="rgba(240,232,255,0.7)">⚡ TaskGen</text>
      <text x="198" y="9" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="end">Groq Llama 3.3 70B</text>
    </g>
    <!-- STT row -->
    <g transform="translate(12 78)">
      <circle cx="6" cy="6" r="4" fill="#88dd66"/>
      <text x="18" y="9" font-family="system-ui,sans-serif" font-size="9" fill="rgba(240,232,255,0.7)">🎤 STT</text>
      <text x="198" y="9" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="end">Web Speech</text>
    </g>
    <!-- TTS row -->
    <g transform="translate(12 98)">
      <circle cx="6" cy="6" r="4" fill="#cc88ff"/>
      <text x="18" y="9" font-family="system-ui,sans-serif" font-size="9" fill="rgba(240,232,255,0.7)">🔊 TTS</text>
      <text x="198" y="9" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="end">ElevenLabs Turbo</text>
    </g>

    <!-- Open Settings CTA -->
    <g transform="translate(12 130)">
      <rect width="186" height="32" rx="8" fill="url(#accent)"/>
      <text x="93" y="20" font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#0a0218" text-anchor="middle" letter-spacing="0.5">OPEN SETTINGS</text>
    </g>

    <!-- Mood/affection mini gauge -->
    <g transform="translate(12 172)">
      <text x="0" y="8" font-family="system-ui,sans-serif" font-size="8" fill="rgba(204,136,255,0.7)">MOOD: amused</text>
      <text x="186" y="8" font-family="system-ui,sans-serif" font-size="8" fill="rgba(204,136,255,0.7)" text-anchor="end">♥ 67  ✦ 54</text>
      <rect x="0" y="14" width="186" height="2" rx="1" fill="rgba(255,255,255,0.1)"/>
      <rect x="0" y="14" width="125" height="2" rx="1" fill="#cc88ff"/>
    </g>
  </g>

  <!-- Top-left biome badge -->
  <g transform="translate(36 90)">
    <rect width="120" height="28" rx="14" fill="rgba(0,0,0,0.55)" stroke="rgba(136,221,102,0.4)"/>
    <circle cx="16" cy="14" r="5" fill="#88dd66"/>
    <text x="30" y="18" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#e0ffd8" letter-spacing="0.5">FOREST · HUMAN</text>
  </g>

  <!-- Subtitle bubble -->
  <g transform="translate(36 720)">
    <rect width="368" height="58" rx="14" fill="rgba(0,0,0,0.65)" stroke="rgba(204,136,255,0.35)"/>
    <text x="16" y="22" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#cc88ff" letter-spacing="1.2">MOSSGLOW · COMPANION</text>
    <text x="16" y="42" font-family="system-ui,sans-serif" font-size="12" fill="#fff">There — by the door. Do you smell that?</text>
    <text x="16" y="54" font-family="system-ui,sans-serif" font-size="12" fill="#fff">Old smoke. Someone passed through recently.</text>
  </g>

  <!-- Waveform + mic -->
  <g transform="translate(36 796)">
    <rect width="280" height="44" rx="22" fill="rgba(0,0,0,0.6)" stroke="rgba(204,136,255,0.4)"/>
    <g fill="#cc88ff">
      <rect x="16" y="20" width="2" height="4" rx="1"/>
      <rect x="22" y="14" width="2" height="16" rx="1"/>
      <rect x="28" y="10" width="2" height="24" rx="1"/>
      <rect x="34" y="6" width="2" height="32" rx="1"/>
      <rect x="40" y="12" width="2" height="20" rx="1"/>
      <rect x="46" y="8" width="2" height="28" rx="1"/>
      <rect x="52" y="14" width="2" height="16" rx="1"/>
      <rect x="58" y="6" width="2" height="32" rx="1"/>
      <rect x="64" y="18" width="2" height="8" rx="1"/>
      <rect x="70" y="12" width="2" height="20" rx="1"/>
      <rect x="76" y="8" width="2" height="28" rx="1"/>
      <rect x="82" y="14" width="2" height="16" rx="1"/>
      <rect x="88" y="20" width="2" height="4" rx="1"/>
      <rect x="94" y="10" width="2" height="24" rx="1"/>
      <rect x="100" y="6" width="2" height="32" rx="1"/>
      <rect x="106" y="14" width="2" height="16" rx="1"/>
      <rect x="112" y="18" width="2" height="8" rx="1"/>
      <rect x="118" y="12" width="2" height="20" rx="1"/>
      <rect x="124" y="8" width="2" height="28" rx="1"/>
      <rect x="130" y="14" width="2" height="16" rx="1"/>
      <rect x="136" y="20" width="2" height="4" rx="1"/>
      <rect x="142" y="16" width="2" height="12" rx="1"/>
      <rect x="148" y="10" width="2" height="24" rx="1"/>
      <rect x="154" y="6" width="2" height="32" rx="1"/>
      <rect x="160" y="14" width="2" height="16" rx="1"/>
      <rect x="166" y="18" width="2" height="8" rx="1"/>
      <rect x="172" y="12" width="2" height="20" rx="1"/>
      <rect x="178" y="8" width="2" height="28" rx="1"/>
      <rect x="184" y="14" width="2" height="16" rx="1"/>
      <rect x="190" y="20" width="2" height="4" rx="1"/>
      <rect x="196" y="16" width="2" height="12" rx="1"/>
      <rect x="202" y="10" width="2" height="24" rx="1"/>
      <rect x="208" y="14" width="2" height="16" rx="1"/>
      <rect x="214" y="18" width="2" height="8" rx="1"/>
    </g>
    <text x="240" y="28" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#cc88ff" letter-spacing="1">LIVE</text>
  </g>
  <g transform="translate(346 796)">
    <circle cx="22" cy="22" r="22" fill="#cc88ff"/>
    <circle cx="22" cy="22" r="22" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="17" y="12" width="10" height="16" rx="5" fill="#1a0a2a"/>
    <path d="M 14 22 Q 14 30 22 30 Q 30 30 30 22" fill="none" stroke="#1a0a2a" stroke-width="2"/>
    <line x1="22" y1="30" x2="22" y2="34" stroke="#1a0a2a" stroke-width="2"/>
  </g>

  <rect x="170" y="850" width="100" height="4" rx="2" fill="#fff" opacity="0.5"/>
</svg>
