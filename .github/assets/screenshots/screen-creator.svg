<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <radialGradient id="cBg" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
  </defs>

  <rect width="400" height="800" fill="url(#cBg)"/>

  <text x="200" y="55" text-anchor="middle" font-family="Cinzel Decorative, serif" font-weight="900" font-size="16" letter-spacing="4" fill="#cc88ff">FORGE YOUR COMPANION</text>
  <text x="200" y="80" text-anchor="middle" font-family="Crimson Pro, serif" font-size="11" font-style="italic" letter-spacing="2" fill="#7a5a99">Speak them into existence</text>

  <!-- Chat history -->
  <g transform="translate(30 120)">
    <rect x="0" y="0" width="3" height="40" fill="#aa66ff" opacity="0.4"/>
    <text x="14" y="14" font-family="Crimson Pro, serif" font-style="italic" font-size="13" fill="#c8b0e0">Describe your companion.</text>
    <text x="14" y="32" font-family="Crimson Pro, serif" font-style="italic" font-size="13" fill="#c8b0e0">Who or what are they?</text>

    <rect x="130" y="60" width="210" height="46" rx="8" fill="rgba(120,40,255,0.15)"/>
    <text x="328" y="78" text-anchor="end" font-family="Crimson Pro, serif" font-size="14" fill="#e0c8ff">A talking raven, alive for</text>
    <text x="328" y="96" text-anchor="end" font-family="Crimson Pro, serif" font-size="14" fill="#e0c8ff">400 years</text>

    <rect x="0" y="120" width="3" height="58" fill="#aa66ff" opacity="0.4"/>
    <text x="14" y="134" font-family="Crimson Pro, serif" font-style="italic" font-size="13" fill="#c8b0e0">What did the centuries do</text>
    <text x="14" y="152" font-family="Crimson Pro, serif" font-style="italic" font-size="13" fill="#c8b0e0">to their personality?</text>
    <text x="14" y="170" font-family="Crimson Pro, serif" font-style="italic" font-size="13" fill="#c8b0e0">Bitter, wise, mad?</text>
  </g>

  <!-- Suggestion pills -->
  <text x="30" y="335" font-family="Cinzel, serif" font-size="9" letter-spacing="3" fill="#7a5a99">SUGGESTIONS</text>
  <g transform="translate(30 350)">
    <rect x="0" y="0" width="62" height="24" rx="12" fill="rgba(120,40,200,0.2)" stroke="#7a3acc" stroke-opacity="0.4"/>
    <text x="31" y="16" text-anchor="middle" font-family="Crimson Pro, serif" font-size="12" fill="#c8a8e8">Human</text>
    <rect x="70" y="0" width="50" height="24" rx="12" fill="rgba(120,40,200,0.2)" stroke="#7a3acc" stroke-opacity="0.4"/>
    <text x="95" y="16" text-anchor="middle" font-family="Crimson Pro, serif" font-size="12" fill="#c8a8e8">Elf</text>
    <rect x="128" y="0" width="62" height="24" rx="12" fill="rgba(120,40,200,0.2)" stroke="#7a3acc" stroke-opacity="0.4"/>
    <text x="159" y="16" text-anchor="middle" font-family="Crimson Pro, serif" font-size="12" fill="#c8a8e8">Dwarf</text>
    <rect x="198" y="0" width="92" height="24" rx="12" fill="rgba(180,80,255,0.35)" stroke="#aa66ff"/>
    <text x="244" y="16" text-anchor="middle" font-family="Crimson Pro, serif" font-size="12" fill="#ffffff">Werewolf</text>

    <rect x="0" y="32" width="106" height="24" rx="12" fill="rgba(120,40,200,0.2)" stroke="#7a3acc" stroke-opacity="0.4"/>
    <text x="53" y="48" text-anchor="middle" font-family="Crimson Pro, serif" font-size="12" fill="#c8a8e8">Talking Fox</text>
    <rect x="114" y="32" width="124" height="24" rx="12" fill="rgba(120,40,200,0.2)" stroke="#7a3acc" stroke-opacity="0.4"/>
    <text x="176" y="48" text-anchor="middle" font-family="Crimson Pro, serif" font-size="12" fill="#c8a8e8">Cosmic Moth</text>
    <rect x="246" y="32" width="100" height="24" rx="12" fill="rgba(120,40,200,0.2)" stroke="#7a3acc" stroke-opacity="0.4"/>
    <text x="296" y="48" text-anchor="middle" font-family="Crimson Pro, serif" font-size="12" fill="#c8a8e8">Void Wraith</text>
  </g>

  <!-- Input row -->
  <g transform="translate(30 470)">
    <rect width="280" height="48" rx="8" fill="rgba(255,255,255,0.04)" stroke="#7a3acc" stroke-opacity="0.4"/>
    <text x="16" y="30" font-family="Crimson Pro, serif" font-size="15" fill="#e0c8ff">Bitter, but mostly tired...</text>
    <rect x="290" width="60" height="48" rx="8" fill="rgba(120,40,200,0.6)" stroke="#aa66ff"/>
    <text x="320" y="34" text-anchor="middle" font-family="Crimson Pro, serif" font-size="24" fill="#ffffff">→</text>
  </g>

  <!-- 3D model preview -->
  <g transform="translate(200 620)">
    <circle r="60" fill="rgba(120,40,200,0.1)" stroke="#7a3acc" stroke-opacity="0.4" stroke-dasharray="3 3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Crimson Pro, serif" font-style="italic" font-size="11" fill="#aa88dd">3D model</text>
    <text x="0" y="6" text-anchor="middle" font-family="Crimson Pro, serif" font-style="italic" font-size="11" fill="#aa88dd">generating...</text>
    <text x="0" y="34" text-anchor="middle" font-family="Cinzel, serif" font-size="10" letter-spacing="2" fill="#7a5a99">42%</text>

    <!-- Progress ring -->
    <circle r="64" fill="none" stroke="#cc88ff" stroke-width="1.5" stroke-dasharray="170 230" transform="rotate(-90)"/>
  </g>
</svg>
