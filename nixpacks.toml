[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install --prefix server --no-audit --no-fund",
  "npm install --prefix client --no-audit --no-fund"
]

[phases.build]
cmds = [
  "npm run build --prefix client",
  "cp -r client/dist client-dist"
]

[start]
cmd = "node server/index.js"
